<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>トラック演出＆コマ表示</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #f4f4f4;
      font-family: sans-serif;
    }

    /* --- 全体の枠組み（スマホ・PC両対応） --- */
    .wrapper {
      max-width: 600px;
      margin: 0 auto;
      background-color: #ffffff;
      min-height: 100vh;
      overflow-x: hidden; /* 横スクロールバーの発生を防止 */
    }

    /* --- トラックが走るヘッダーエリア --- */
    .truck-stage {
      position: relative;
      width: 100%;
      height: 180px;          /* トラックエリアの高さ */
      overflow: hidden;      /* 画面外のトラックを隠す */
      border-bottom: 2px solid #ddd;
    }

    /* 走るトラック画像 */
    .truck {
      position: absolute;
      bottom: 10px;           /* 下からの位置 */
      left: 50%;              /* 中央基準 */
      width: 180px;           /* トラックの横幅（調整可） */
      height: auto;
      transform: translateX(100vw); /* 初期位置は右の画面外 */
      
      /* アニメーション名 / 時間(3.5秒) / イージング / 終了位置をキープ */
      animation: truckDrive 4.5s cubic-bezier(0.25, 1, 0.5, 1) 1s forwards;
    }

    /* --- トラックの走行アニメーション --- */
    @keyframes truckDrive {
      /* 1. 右外からスタート */
      0% {
        transform: translateX(100vw);
      }
      /* 2. 左外へ勢いよく通り過ぎる */
      35% {
        transform: translateX(-100vw);
      }
      /* 3. 見えない間に右外へ瞬間移動 */
      35.1% {
        transform: translateX(100vw);
      }
      /* 4. 再びやってきて中央に到着 */
      80% {
        transform: translateX(-50%);
      }
      /* 5. ブレーキの反動で少し前にのめる */
      88% {
        transform: translateX(-54%);
      }
      /* 6. 中央でピタッと停止 */
      100% {
        transform: translateX(-50%);
      }
    }

    /* --- コマ画像エリア --- */
    .image-container {
      padding: 16px;
    }

    .image-container img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <div class="wrapper">

    <!-- トラック演出ヘッダー -->
    <header class="truck-stage">
      <img src="truck.png" alt="トラック" class="truck">
    </header>

    <!-- コマ画像 -->
    <main class="image-container">
      <img src="koma.png" alt="コマ画像">
    </main>

  </div>

</body>
</html>
