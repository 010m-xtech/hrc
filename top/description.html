<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>トラック演出＆ロゴ＆コマ表示</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #f4f4f4;
      font-family: sans-serif;
    }

    /* 全体の枠組み */
    .wrapper {
      max-width: 600px;
      margin: 0 auto;
      background-color: #ffffff;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* トラックとロゴが配置されるヘッダーエリア */
    .truck-stage {
      position: relative;
      width: 100%;
      height: 200px;
      background-color: #ffffff;
      overflow: hidden;
      border-bottom: 2px solid #ddd;
    }

    /* --- 背景ロゴ（最初から常時表示） --- */
    .background-logo {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 200px; /* サイズ調整可 */
      height: auto;
      transform: translate(-50%, -50%);
      z-index: 1;   /* トラックの背面に配置 */
    }

    /* --- 走るトラック画像 --- */
    .truck {
      position: absolute;
      bottom: 5px;
      left: 50%;
      width: 160px; /* サイズ調整可 */
      height: auto;
      transform: translateX(100vw); /* 初期状態は右の画面外 */
      z-index: 2;
      
      /* 1秒待機後、1.8秒かけて右から中央へ到着 */
      animation: truckDrive 1.8s cubic-bezier(0.25, 1, 0.5, 1) 1s forwards;
    }

    /* トラックの走行アニメーション（1回のみ・中央でブレーキ） */
    @keyframes truckDrive {
      0% {
        transform: translateX(100vw);
      }
      85% {
        transform: translateX(-54%); /* ブレーキの反動 */
      }
      100% {
        transform: translateX(-50%); /* 中央でピタッと停止 */
      }
    }

    /* コマ画像エリア */
    .image-container {
      padding: 16px;
    }

    .image-container img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <div class="wrapper">

    <!-- トラック・ロゴ演出ヘッダー -->
    <header class="truck-stage">
      <!-- 常時表示される背景ロゴ -->
      <img src="rogo.png" alt="ロゴ" class="background-logo">
      
      <!-- 右から走ってくるトラック -->
      <img src="truck.png" alt="トラック" class="truck">
    </header>

    <!-- コマ画像 -->
    <main class="image-container">
      <img src="koma.png" alt="コマ画像">
    </main>

   <!-- ハッピーリングチャリティ説明エリア -->
    <section class="about-container">
      <div class="about-card">
        <h2 class="about-title">ハッピーリングチャリティとは</h2>
        <p class="about-text">
          キャンペーン期間中に、参加店舗で提供された『生ビール』1Lにつき1円が『子ども食堂』や『子どもの問題解決に取り組む団体』に寄付される取り組みです。
        </p>
      </div>
    </section>    
    
  </div>

</body>
</html>
