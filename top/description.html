<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スマホ・PC対応ページ</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f4f4f4; /* 背景色 */
    }

    /* --- 全体の枠組み（PC時の幅制限と中央寄せ） --- */
    .wrapper {
      max-width: 600px;  /* PC時の最大横幅（好みで変更可） */
      margin: 0 auto;    /* 画面中央に配置 */
      background-color: #ffffff; /* コンテンツ背景を白にする場合 */
      box-sizing: border-box;
    }

    /* --- 一番上のヘッダー画像 --- */
    .header-image img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* --- コマ画像エリア --- */
    .image-container {
      padding: 16px;     /* 左右・上下の余白 */
      box-sizing: border-box;
    }

    .image-container img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 8px; /* 角丸（不要なら削除） */
    }
  </style>
</head>
<body>

  <!-- PC時に横幅を揃えるラッパー -->
  <div class="wrapper">

    <!-- ヘッダー画像 -->
    <header class="header-image">
      <img src="hed.png" alt="ヘッダー画像">
    </header>

    <!-- コマ画像 -->
    <main class="image-container">
      <img src="koma.png" alt="コマ画像">
    </main>

  </div>

</body>
</html>
