<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>トラック演出＆ロゴ＆コマ表示</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #f4f4f4;
      font-family: sans-serif;
    }

    /* 全体の枠組み */
    .wrapper {
      max-width: 600px;
      margin: 0 auto;
      background-color: #ffffff;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* トラックとロゴが配置されるヘッダーエリア */
    .truck-stage {
      position: relative;
      width: 100%;
      height: 200px;      /* 調整可 */
      background-color: #ffffff;
      overflow: hidden;   /* 画面外のトラックを隠す */
      border-bottom: 2px solid #ddd;
    }

    /* --- [追加] 背景ロゴのスタイル --- */
    .background-logo {
      position: absolute;
      top: 50%;           /* 縦中央基準 */
      left: 50%;          /* 横中央基準 */
      
      /* ★サイズ指定：ここをお好みの大きさに調整してください */
      width: 200px;       /* 例：横幅200px。トラックより少し大きくすると見栄えが良いです */
      height: auto;       /* 比率維持 */
      
      /* 中央寄せの微調整と、初期状態は透明 */
      transform: translate(-50%, -50%);
      opacity: 0;
      
      /* ロゴの重ね順：トラックより後ろ(下)にする */
      z-index: 1;
      
      /* アニメーション：1秒待機(トラックが走り出す) + トラックが左に消えるタイミング(約1.2秒)でフェードイン開始 */
      /* アニメーション名(fadeIn) / 時間(1s) / タイミング(ease) / 遅延(計2.2s) / 状態キープ */
      animation: fadeIn 1s ease 2.2s forwards;
    }

    /* 走るトラック画像 */
    .truck {
      position: absolute;
      bottom: 10px;
      left: 50%;
      width: 160px;       /* 調整可 */
      height: auto;
      transform: translateX(100vw);
      
      /* トラックの重ね順：ロゴより手前(上)にする */
      z-index: 2;
      
      /* アニメーション（1秒待機、3.5秒かけて走行） */
      animation: truckDrive 4.0s cubic-bezier(0.25, 1, 0.5, 1) 1s forwards;
    }

    /* --- アニメーション定義 --- */

    /* [追加] ロゴのフェードイン */
    @keyframes fadeIn {
      0% { opacity: 0; transform: translate(-50%, -45%); } /* 少し下からフワッと */
      100% { opacity: 1; transform: translate(-50%, -50%); }
    }

    /* トラックの走行（前回と同じ） */
    @keyframes truckDrive {
      0% { transform: translateX(100vw); }
      35% { transform: translateX(-100vw); } /* 1回目：左に消える */
      35.1% { transform: translateX(100vw); }
      80% { transform: translateX(-50%); }     /* 2回目：中央へ */
      88% { transform: translateX(-54%); }     /* ブレーキ */
      100% { transform: translateX(-50%); }
    }

    /* コマ画像エリア */
    .image-container {
      padding: 16px;
    }

    .image-container img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <div class="wrapper">

    <!-- トラック・ロゴ演出ヘッダー -->
    <header class="truck-stage">
      <!-- [追加] 背景ロゴ (truck.pngより先に書く必要はありませんが、z-indexで制御しています) -->
      <img src="rogo.png" alt="ロゴ" class="background-logo">
      
      <!-- 走るトラック -->
      <img src="truck.png" alt="トラック" class="truck">
    </header>

    <!-- コマ画像 -->
    <main class="image-container">
      <img src="koma.png" alt="コマ画像">
    </main>

  </div>

</body>
</html>
